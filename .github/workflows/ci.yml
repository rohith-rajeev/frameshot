name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: system deps (Linux Qt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: install
        run: |
          python -m pip install -U pip
          pip install -e . pytest

      - name: unit tests
        run: python -m pytest tests/ -q

      - name: Qt layer smoke (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from PyQt6.QtWidgets import QApplication
          app = QApplication([])
          import frameshot.cli, frameshot.capture, frameshot.doctor, frameshot.background
          import frameshot.icons, frameshot.updates
          from frameshot.config import FrameshotSettings
          from frameshot.overlay import FrameshotOverlay, SettingsDialog
          from frameshot import __version__
          print('frameshot', __version__, 'imports OK on', sys.platform)
          "

      - name: packaging check (dynamic version resolves)
        run: |
          pip install build
          python -m build --wheel --outdir dist-check
          ls dist-check/
